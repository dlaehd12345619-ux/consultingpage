<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>관리자 | 만나 소프트웨어</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <!-- 설정 안내 -->
  <main id="viewConfig" class="center-wrap" hidden>
    <div class="login-card">
      <h1><i class="fas fa-triangle-exclamation"></i> Supabase 연결 필요</h1>
      <p class="muted">환경변수 <b>VITE_SUPABASE_URL</b>, <b>VITE_SUPABASE_ANON_KEY</b>가 설정되지 않았습니다. Vercel 환경변수를 확인하고 다시 배포해 주세요.</p>
    </div>
  </main>

  <!-- 로그인 -->
  <main id="viewLogin" class="center-wrap" hidden>
    <form id="loginForm" class="login-card" novalidate>
      <div class="brand"><span class="logo-mark">만</span><span><b>만나 소프트웨어</b><small>관리자</small></span></div>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <p id="loginError" class="error" hidden></p>
      <button type="submit" class="btn primary" id="loginBtn">로그인</button>
    </form>
  </main>

  <!-- 대시보드 -->
  <div id="viewApp" hidden>
    <header class="topbar">
      <div class="brand"><span class="logo-mark">만</span><span><b>문의 관리</b><small id="whoami"></small></span></div>
      <div class="topbar-actions">
        <button class="btn" id="refreshBtn" title="새로고침"><i class="fas fa-rotate"></i><span> 새로고침</span></button>
        <button class="btn" id="csvBtn"><i class="fas fa-file-csv"></i><span> CSV</span></button>
        <button class="btn" id="logoutBtn"><i class="fas fa-right-from-bracket"></i><span> 로그아웃</span></button>
      </div>
    </header>

    <main class="container">
      <section class="stats" id="stats"></section>

      <section class="toolbar">
        <div class="tabs" id="tabs">
          <button class="tab active" data-filter="all">전체</button>
          <button class="tab" data-filter="new">신규</button>
          <button class="tab" data-filter="contacted">연락함</button>
          <button class="tab" data-filter="done">완료</button>
        </div>
        <input id="search" type="search" placeholder="이름·대학·연락처·내용 검색" />
      </section>

      <p id="appError" class="error" hidden></p>
      <section id="list" class="list"></section>
      <p id="empty" class="empty" hidden>표시할 문의가 없습니다.</p>
    </main>
  </div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
